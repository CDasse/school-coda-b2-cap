info:
  name: Chercher un trajet
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/trips?origin={{idStation1}}&destination={{idStation2}}&date=2024-02-01T09:00:00Z"
  params:
    - name: origin
      value: "{{idStation1}}"
      type: query
    - name: destination
      value: "{{idStation2}}"
      type: query
    - name: date
      value: 2024-02-01T09:00:00Z
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("idTrip",res.body.data[0].id)
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
