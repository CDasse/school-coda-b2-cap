info:
  name: Réserver
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  body:
    type: json
    data: |-
      {
        "trip_id": "{{idTrip}}",
        "passenger_name": "John Doe",
        "has_bicycle": true,
        "has_dog": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("reservationId",res.body.id)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
