info:
  name: Chercher une gare
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/stations"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("idStation1",res.body.data[0].id);
        bru.setVar("idStation2",res.body.data[1].id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
