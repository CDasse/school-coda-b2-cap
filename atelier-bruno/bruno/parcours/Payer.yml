info:
  name: Payer
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/bookings/:reservationId/payment"
  params:
    - name: reservationId
      value: "{{reservationId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "amount": 49.99,
        "currency": "gbp",
        "source": {
          "object": "card",
          "name": "J. Doe",
          "number": "4242424242424242",
          "cvc": "123",
          "exp_month": 12,
          "exp_year": 2025,
          "address_line1": "123 Fake Street",
          "address_line2": "4th Floor",
          "address_city": "London",
          "address_country": "gb",
          "address_post_code": "N12 9XX"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
