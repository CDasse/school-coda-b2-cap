info:
  name: Relire sa reservation
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/bookings/:reservationId"
  params:
    - name: reservationId
      value: "{{reservationId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
