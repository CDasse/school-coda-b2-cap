info:
  name: Annuler
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/bookings/:reservationId"
  params:
    - name: reservationId
      value: "{{reservationId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
