info:
  name: Rechercher une ville desservie
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/cities?q=dij&limit=5"
  params:
    - name: q
      value: dij
      type: query
    - name: limit
      value: "5"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
